  <text x="480" y="502" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#334155">成交量比较的是相对高低，只观察参与程度。量增不能写成趋势会延续。</text>

  <rect x="0" y="540" width="960" height="40" fill="#f1f5f9"/>
  <text x="480" y="565" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">示意图 · 教学抽象几何 · 非真实行情 · 不构成交易建议</text>

