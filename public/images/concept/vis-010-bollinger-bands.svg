<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">布林带中轨与开口收口示意图</title>
  <desc id="desc">教学示意图。三格对照：收口时带宽变窄；开口时带宽变宽，向上或向下都可能出现。中轨是 SMA(20)。碰上轨不是卖点。不是真实行情。</desc>
