  <text x="82" y="246" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1d4ed8">上轨</text>
  <text x="82" y="282" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#0f172a">中轨 SMA(20)</text>
  <text x="82" y="338" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1d4ed8">下轨</text>
  <text x="548" y="142" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">走轨道</text>
  <text x="800" y="448" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600" fill="#1d4ed8">走轨道</text>

  <text x="192" y="436" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">只说明波动收缩，方向未知</text>
  <text x="480" y="436" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">碰上轨不是卖点</text>
  <text x="768" y="436" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#475569">碰下轨不是买点</text>
  <text x="480" y="478" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#334155">上轨 = 中轨 + 2倍标准差，下轨 = 中轨 - 2倍标准差。收口之后往哪边开口事先不知道。三格是对照，不是连续行情。</text>

  <rect x="0" y="520" width="960" height="40" fill="#f1f5f9"/>
  <text x="480" y="545" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="12" fill="#64748b">示意图 · 教学抽象几何 · 非真实行情 · 不构成交易建议</text>
</svg>
