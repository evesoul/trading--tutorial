<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">清算瀑布中量 / OI / CVD 失真示意图</title>
  <desc id="desc">教学示意图。同一时段抽象价格插针，底下成交量、持仓量、CVD 同时剧烈抖动。瀑布进行中这些数暂时不可解释方向。不是真实行情，不教抄底。</desc>
  <rect width="1200" height="740" fill="#f8fafc"/>
  <rect width="1200" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="#e2e8f0"/>
  <text x="32" y="46" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">清算瀑布：量 / OI / CVD 同时失真</text>
  <rect x="1048" y="22" width="120" height="30" rx="4" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1108" y="43" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#c2410c">示意图</text>

  <rect x="28" y="88" width="1144" height="40" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="600" y="114" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#9a3412">瀑布进行中，这些数暂时不可解释方向。空仓或只平不开。</text>

  <rect x="28" y="144" width="1144" height="168" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="48" y="172" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#334155">价格：强平市价打进薄盘 → 插针 → 连锁</text>

  <line x1="80" y1="196" x2="80" y2="288" stroke="#e2e8f0"/>
  <line x1="80" y1="288" x2="720" y2="288" stroke="#e2e8f0"/>

  <line x1="100" y1="220" x2="100" y2="248" stroke="#16a34a" stroke-width="2"/><rect x="91" y="228" width="18" height="16" fill="#16a34a"/>
  <line x1="160" y1="212" x2="160" y2="252" stroke="#16a34a" stroke-width="2"/><rect x="151" y="220" width="18" height="20" fill="#16a34a"/>
  <line x1="220" y1="216" x2="220" y2="256" stroke="#dc2626" stroke-width="2"/><rect x="211" y="228" width="18" height="18" fill="#dc2626"/>
  <line x1="280" y1="208" x2="280" y2="260" stroke="#16a34a" stroke-width="2"/><rect x="271" y="220" width="18" height="22" fill="#16a34a"/>
  <line x1="360" y1="188" x2="360" y2="288" stroke="#dc2626" stroke-width="2.4"/><rect x="351" y="236" width="18" height="28" fill="#dc2626"/>
  <line x1="440" y1="200" x2="440" y2="268" stroke="#dc2626" stroke-width="2"/><rect x="431" y="220" width="18" height="24" fill="#dc2626"/>
  <line x1="500" y1="212" x2="500" y2="256" stroke="#16a34a" stroke-width="2"/><rect x="491" y="224" width="18" height="20" fill="#16a34a"/>
  <line x1="560" y1="216" x2="560" y2="252" stroke="#16a34a" stroke-width="2"/><rect x="551" y="228" width="18" height="16" fill="#16a34a"/>

  <text x="372" y="184" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#b91c1c">插针</text>
  <rect x="740" y="188" width="408" height="104" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="944" y="220" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#991b1b">收回不等于底部</text>
  <text x="944" y="248" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155">强平单通常是被动市价</text>
  <text x="944" y="272" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">不教抄瀑布底，不预测结束</text>

  <rect x="28" y="328" width="368" height="248" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="212" y="360" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#334155">成交量失真</text>
  <rect x="56" y="456" width="28" height="48" fill="#94a3b8"/>
  <rect x="100" y="444" width="28" height="60" fill="#94a3b8"/>
  <rect x="144" y="452" width="28" height="52" fill="#94a3b8"/>
  <rect x="188" y="380" width="36" height="124" fill="#64748b"/>
  <rect x="240" y="448" width="28" height="56" fill="#94a3b8"/>
  <rect x="284" y="460" width="28" height="44" fill="#94a3b8"/>
  <rect x="328" y="468" width="28" height="36" fill="#94a3b8"/>
  <text x="212" y="532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155">巨量可能是连锁平仓</text>
  <text x="212" y="556" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">不是新开仓共识</text>

  <rect x="416" y="328" width="368" height="248" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="600" y="360" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#c2410c">OI 失真</text>
  <polyline points="456,400 500,396 544,404 588,388 632,460 676,472 720,468" fill="none" stroke="#d97706" stroke-width="3"/>
  <circle cx="632" cy="460" r="5" fill="#c2410c"/>
  <text x="600" y="532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155">未平仓被关掉，急降</text>
  <text x="600" y="556" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">口径可能滞后</text>

  <rect x="804" y="328" width="368" height="248" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="988" y="360" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1d4ed8">CVD 失真</text>
  <polyline points="844,400 888,396 932,404 976,388 1020,500 1064,512 1108,508" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="1020" cy="500" r="5" fill="#1d4ed8"/>
  <text x="988" y="532" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155">强平 taker 扭曲 Delta</text>
  <text x="988" y="556" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">不是主力出货</text>

  <text x="600" y="612" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">阳线 = 收盘高于开盘（绿柱）；阴线 = 收盘低于开盘（红柱）。成交量柱用中性灰，避免被读成方向。</text>
  <text x="600" y="638" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">量 + OI + CVD 同时剧烈抖动：先记「数据不可用」，不写方向句。多空比同样可能失真。</text>

  <rect x="0" y="700" width="1200" height="40" fill="#f1f5f9"/>
  <text x="600" y="726" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">教学抽象 · 非真实行情 · 不构成交易建议</text>
</svg>
