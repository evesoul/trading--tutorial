<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">摆动结构与假突破示意图</title>
  <desc id="desc">教学示意图。三格分别表示：更高高点与更高低点构成上升结构；推进之后的回撤不是自动反转；影线刺破前高后收盘回到区内。不是真实行情，不构成交易建议。</desc>
  <rect width="1200" height="740" fill="#f8fafc"/>
  <rect width="1200" height="72" fill="#ffffff"/>
  <line x1="0" y1="72" x2="1200" y2="72" stroke="#e2e8f0"/>
  <text x="32" y="46" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#0f172a">摆动结构与假突破示意图</text>
  <rect x="1048" y="22" width="120" height="30" rx="4" fill="#fff7ed" stroke="#fdba74"/>
  <text x="1108" y="43" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#c2410c">示意图</text>

  <rect x="28" y="88" width="372" height="512" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <rect x="414" y="88" width="372" height="512" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <rect x="800" y="88" width="372" height="512" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="214" y="120" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#1d4ed8">上升结构：HH + HL</text>
  <text x="600" y="120" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#15803d">推进之后出现回撤</text>
  <text x="986" y="120" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#b91c1c">假突破：影线穿、收盘回</text>

  <line x1="72" y1="458" x2="72" y2="500" stroke="#16a34a" stroke-width="2"/><rect x="63" y="468" width="18" height="22" fill="#16a34a"/>
  <line x1="118" y1="380" x2="118" y2="452" stroke="#16a34a" stroke-width="2"/><rect x="109" y="392" width="18" height="48" fill="#16a34a"/>
  <line x1="164" y1="268" x2="164" y2="372" stroke="#16a34a" stroke-width="2"/><rect x="155" y="284" width="18" height="76" fill="#16a34a"/>
  <line x1="210" y1="310" x2="210" y2="418" stroke="#dc2626" stroke-width="2"/><rect x="201" y="330" width="18" height="70" fill="#dc2626"/>
  <line x1="256" y1="368" x2="256" y2="432" stroke="#dc2626" stroke-width="2"/><rect x="247" y="384" width="18" height="34" fill="#dc2626"/>
  <line x1="302" y1="248" x2="302" y2="368" stroke="#16a34a" stroke-width="2"/><rect x="293" y="264" width="18" height="86" fill="#16a34a"/>
  <line x1="348" y1="188" x2="348" y2="288" stroke="#16a34a" stroke-width="2"/><rect x="339" y="204" width="18" height="66" fill="#16a34a"/>

  <polyline points="72,500 164,268 256,432 348,188" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="72" cy="500" r="5" fill="#2563eb"/>
  <circle cx="164" cy="268" r="5" fill="#2563eb"/>
  <circle cx="256" cy="432" r="5" fill="#2563eb"/>
  <circle cx="348" cy="188" r="5" fill="#2563eb"/>

  <text x="86" y="524" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">L 摆动低点</text>
  <text x="178" y="252" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">H 摆动高点</text>
  <text x="268" y="454" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">HL 更高低点</text>
  <text x="250" y="174" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">HH 更高高点</text>

  <text x="214" y="552" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155">高低点在抬高</text>
  <text x="214" y="576" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">描述已发生的点，不是开仓指令</text>

  <line x1="430" y1="468" x2="760" y2="468" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="620" y="490" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#1d4ed8">前低 HL 仍在</text>

  <line x1="458" y1="400" x2="458" y2="460" stroke="#16a34a" stroke-width="2"/><rect x="449" y="412" width="18" height="36" fill="#16a34a"/>
  <line x1="504" y1="340" x2="504" y2="412" stroke="#16a34a" stroke-width="2"/><rect x="495" y="352" width="18" height="48" fill="#16a34a"/>
  <line x1="550" y1="270" x2="550" y2="352" stroke="#16a34a" stroke-width="2"/><rect x="541" y="282" width="18" height="58" fill="#16a34a"/>
  <line x1="596" y1="200" x2="596" y2="292" stroke="#16a34a" stroke-width="2"/><rect x="587" y="214" width="18" height="66" fill="#16a34a"/>
  <line x1="642" y1="230" x2="642" y2="328" stroke="#dc2626" stroke-width="2"/><rect x="633" y="248" width="18" height="62" fill="#dc2626"/>
  <line x1="688" y1="280" x2="688" y2="378" stroke="#dc2626" stroke-width="2"/><rect x="679" y="298" width="18" height="62" fill="#dc2626"/>
  <line x1="734" y1="320" x2="734" y2="408" stroke="#dc2626" stroke-width="2"/><rect x="725" y="338" width="18" height="52" fill="#dc2626"/>

  <text x="448" y="188" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#15803d">推进（沿结构方向）</text>
  <polyline points="470,248 596,214" fill="none" stroke="#15803d" stroke-width="2"/>
  <polygon points="596,214 584,208 584,220" fill="#15803d"/>
  <text x="700" y="430" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#b45309">回撤</text>
  <text x="700" y="450" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#b45309">（逆向段）</text>
  <polyline points="642,360 720,400" fill="none" stroke="#b45309" stroke-width="2"/>
  <polygon points="720,400 708,394 710,408" fill="#b45309"/>

  <text x="600" y="552" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155">回撤低点仍高于前低</text>
  <text x="600" y="576" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">回撤不是自动反转</text>

  <rect x="824" y="248" width="328" height="64" fill="#fde68a" fill-opacity="0.65"/>
  <text x="986" y="236" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#d97706">前高区（不是发丝价）</text>

  <line x1="850" y1="340" x2="850" y2="412" stroke="#16a34a" stroke-width="2"/><rect x="841" y="352" width="18" height="48" fill="#16a34a"/>
  <line x1="900" y1="300" x2="900" y2="372" stroke="#16a34a" stroke-width="2"/><rect x="891" y="312" width="18" height="48" fill="#16a34a"/>
  <line x1="950" y1="168" x2="950" y2="336" stroke="#dc2626" stroke-width="2"/><rect x="941" y="268" width="18" height="40" fill="#dc2626"/>
  <line x1="1000" y1="280" x2="1000" y2="360" stroke="#dc2626" stroke-width="2"/><rect x="991" y="292" width="18" height="48" fill="#dc2626"/>
  <line x1="1050" y1="296" x2="1050" y2="372" stroke="#16a34a" stroke-width="2"/><rect x="1041" y="308" width="18" height="44" fill="#16a34a"/>
  <line x1="1100" y1="304" x2="1100" y2="368" stroke="#16a34a" stroke-width="2"/><rect x="1091" y="316" width="18" height="36" fill="#16a34a"/>

  <text x="968" y="158" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#b91c1c">影线到过</text>
  <polyline points="958,168 950,168" fill="none" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="820" y="286" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600" fill="#b45309">收盘回到区内</text>
  <text x="986" y="404" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155">阴线：收盘低于开盘</text>

  <text x="986" y="552" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#334155">到过 ≠ 收盘离开</text>
  <text x="986" y="576" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#475569">记假突破，先看已收盘</text>

  <text x="600" y="626" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">阳线 = 收盘高于开盘（绿柱）；阴线 = 收盘低于开盘（红柱）。先标摆动点，再写 HH/HL。不要写成庄家诱多。</text>
  <text x="600" y="650" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" fill="#334155">三格是对照，不是连续行情。默认读图：先结构，再均线，再副图。</text>

  <rect x="0" y="700" width="1200" height="40" fill="#f1f5f9"/>
  <text x="600" y="726" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" fill="#64748b">教学抽象 · 非真实行情 · 不构成交易建议</text>
</svg>
