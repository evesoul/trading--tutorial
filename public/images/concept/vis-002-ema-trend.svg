  <text x="480" y="478" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" fill="#334155">EMA 描述价格相对位置，会滞后。这三段是对照，不是一套连续盈利剧本。</text>

